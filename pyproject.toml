[project]
name = "idealagent"
version = "0.1.0"
description = "A from-scratch Python agent: LLM + tools + loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
idealagent = "idealagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idealagent"]
